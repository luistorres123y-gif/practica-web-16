<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="styles.css
    "
    />
    <title>Practica Trabajo 16P</title>
  </head>
  <body>
    <!-- TAREA 1: MENU LATERAL -->

    <div class="sidebar">
      <div class="sidebar-header">
        <img
          src="assets/images/logo.svg"
          alt="Sol Logo"
          class="brand-logo-icon"
        />
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li class="nav-item active">
            <a href="#">
              <img src="assets/images/icon-bed.svg" alt="" class="nav-icon" />
              <span>Your stay</span>
              <span class="badge">1</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#">
              <img src="assets/images/icon-house.svg" alt="" class="nav-icon" />
              <span>The house</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#">
              <img src="assets/images/icon-pin.svg" alt="" class="nav-icon" />
              <span>Around town</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#">
              <img
                src="assets/images/icon-breakfast-outline.svg"
                alt=""
                class="nav-icon"
              />
              <span>Breakfast</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#">
              <img src="assets/images/icon-mail.svg" alt="" class="nav-icon" />
              <span>Messages</span>
            </a>
          </li>
        </ul>
      </nav>
      <div class="weather-widget">
        <span class="weather-subtitle">TODAY IN CASSIS</span>
        <div class="weather-content">
          <img
            src="assets/images/icon-weather.svg"
            alt="Sunny"
            class="weather-icon"
          />
          <div class="weather-temp">27°</div>
        </div>
        <p class="weather-desc">Sunny · light breeze</p>
      </div>
      <div class="sidebar-footer">
        <p>EST. 1987</p>
        <p>MAISON SOLEIL · 12 RUE DES OLIVIERS · CASSIS</p>
        <p>© 2026 MAISON SOLEIL</p>
      </div>
    </div>
  </body>
</html>
